<!DOCTYPE html>
<html>
<head> 

<title> Login Page</title>
<link rel="stylesheet" href="LoginStyle.css">

</head>
<body>
<form action="UserRecords.html" method="POST">
<div class="loginbox">

    <div class="a">
       <img src=" icons8-heart-with-pulse-40.png " alt="Clinic logo" width="35">

       <h1 class="h1"> Dermatology Clinic </h1> 

    </div>
    <div > 
        <h2 class="h2"> Login </h2>  
        <label for="loginIdentifier">User ID, Email, or Username</label>
        <input type="text" name="loginIdentifier" id="loginIdentifier" 
        placeholder="Enter User ID, Email, or Username" required>
    </div>

    <div>
         <label> Password</label>
         <input type="password" name="Password" id="password" required>
    </div>

    <div class="log">
        <button class="submit"> Log In </button>
    </div>

    <div class="signUp"> 
        <p> Don't have an account?</p>
        <a href=" "> sign up</a>

    </div>

</div>
</form>


</body>






</html>
