
<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../../securityrole.js" data-role="administrator"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <link rel="stylesheet" href="../css/admin.css">
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <i class="ri-heart-pulse-line"></i>
            <h1>Dermatology Clinic</h1>
        </div>

        <div class="header-right">

            <a href="adminSettings.html">
                <i class="ri-settings-3-line"></i>
                Settings
            </a>

            <!-- NOTIFICATION BELL -->
            <div class="notification-container">
                <button
                    class="notification-bell"
                    id="notificationBell"
                    type="button"
                    aria-label="Notifications"
                    aria-expanded="false"
                    aria-controls="notificationPopup"
                >
                    <i class="ri-notification-3-line"></i>
                    <span
                        class="notification-count"
                        id="notificationCount"
                        hidden
                    >0</span>
                </button>

                <div class="notification-popup" id="notificationPopup" hidden>

                    <div class="notification-popup-header">
                        <h3>Notifications</h3>
                    </div>

                    <div class="notification-list" id="notificationList">
                        <p class="notification-empty">
                            No unread notifications.
                        </p>
                    </div>

                </div>
            </div>

            <button class="logout" type="button">
                Log Out
            </button>

        </div>
    </header>

    <div class="main">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <nav class="sidebar--items">

                <a href="adminDashboard.html">
                    <i class="ri-layout-grid-line"></i>
                    Dashboard
                </a>

                <a href="adminProfile.html">
                    <i class="ri-user-line"></i>
                    My Profile
                </a>

                <a href="adminStaff.html">
                    <i class="ri-group-line"></i>
                    Manage Staff
                </a>

                <a href="adminSchedule.html">
                    <i class="ri-calendar-schedule-line"></i>
                    Schedule
                </a>

                <a href="adminAppointments.html">
                    <i class="ri-calendar-line"></i>
                    Appointments
                </a>

                <a href="adminBilling.html">
                    <i class="ri-bill-line"></i>
                    Billing & Payments
                </a>

                <a href="adminReport.html">
                    <i class="ri-file-chart-line"></i>
                    Reports
                </a>

                <a href="adminClinicInfo.html">
                    <i class="ri-hospital-line"></i>
                    Clinic Information
                </a>

            </nav>

            <nav class="sidebar--bottom-items">

                <a href="adminSettings.html" class="active--link">
                    <i class="ri-settings-3-line"></i>
                    Settings
                </a>

            </nav>

        </aside>

        <!-- SETTINGS CONTENT -->
        <main class="mainContent">

            <h2 class="maintitle">Settings</h2>

            <p>
                Manage your administrator account settings.
            </p>

            <!-- CHANGE PASSWORD -->
            <section class="panel" id="changePassword">

                <h2>Change Password</h2>

                <p>
                    Update your administrator account password.
                </p>

                <form id="changePasswordForm">

                    <div class="field">

                        <label for="currentPassword">
                            Current Password
                        </label>

                        <input
                            type="password"
                            id="currentPassword"
                            name="currentPassword"
                            placeholder="Enter current password"
                            required
                            autocomplete="current-password"
                        >

                    </div>

                    <div class="field">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter new password"
                            minlength="8"
                            maxlength="128"
                            required
                            autocomplete="new-password"
                        >

                    </div>

                    <div class="field">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm new password"
                            minlength="8"
                            maxlength="128"
                            required
                            autocomplete="new-password"
                        >

                    </div>

                    <button type="submit" class="primary-btn">
                        Change Password
                    </button>

                    <p id="passwordMessage" role="status"></p>

                </form>

            </section>

        </main>

    </div>

    <!-- SCRIPTS -->
    <script src="../../logout.js"></script>

    <script src="../js/adminNotification.js" defer></script>

    <script src="../js/adminSettings.js" defer></script>

</body>

</html>
