<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="LoginStyle.css">
</head>
<body >

<form id="loginForm">
    <div class="loginbox">

        <div class="a">
            <img src="icons8-heart-with-pulse-40.png"
                 alt="Clinic logo" width="35">

            <h1 class="h1">Dermatology Clinic</h1>
        </div>

        <div>
            <h2 class="h2">Login</h2>

            <label for="loginIdentifier">Email Address</label>
            <input type="email"
                   name="loginIdentifier"
                   id="loginIdentifier"
                   placeholder="Enter your email"
                   required>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password"
                   name="password"
                   id="password"
                   required>
        </div>

        <div class="log">
            <button type="submit" class="submit">Log In</button>
        </div>

        <div class="signUp">
            <p>Don't have an account?</p>
            <a href="SignUp.html">Sign Up</a>
        </div>

    </div>
</form>

<script src="./login.js"></script>


</body>

</html>
