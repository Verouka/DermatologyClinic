<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurse Schedule</title>
    <link rel="stylesheet" href="NurseDashBoard.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <section class="header"> 
        <div class="a">
           <img src="icons8-heart-with-pulse-40.png" alt="Clinic logo" width="35">
           <h1 class="h1">Dermatology Clinic</h1>
        </div> 
        <div class="notification--profile">
            <div class="picon bell">
                <i class="ri-notification-2-line"></i>
            </div>
            <div class="picon profile">
                <img class="img" src="account.png" alt="Nurse Profile">
            </div>
            <button class="logout" type="button" onclick="window.location.href='LoginPage.html'">Log Out</button>
        </div>
    </section>

    <section class="main">
        <div class="sidebar"> 
            <ul class="sidebar--items">
                <li>
                    <a href="NurseDashBoard.html">
                        <span class="icon">
                            <i class="ri-layout-grid-line"></i>
                        </span>
                        <span class="sidebar--item">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="NurseAppointments.html">
                        <span class="icon"><i class="ri-calendar-2-line"></i>
                        </span>
                        <span class="sidebar--item">Appointments</span>
                    </a>
                </li>
                <li>
                    <a href="NursePatients.html">
                        <span class="icon"><i class="ri-file-list-3-line"></i>
                        </span>
                        <span class="sidebar--item">Patient Intake Records</span>
                    </a>
                </li>
                <li>
                    <a href="NurseSchedule.html" class="active--link">
                        <span class="icon"><i class="ri-bank-card-line"></i>
                        </span>
                        <span class="sidebar--item">My Schedule</span>
                    </a>
                </li>
                <li>
                    <a href="NurseProfile.html">
                        <span class="icon"><i class="ri-user-line"></i>
                        </span>
                        <span class="sidebar--item">Profile</span>
                    </a>
                </li>
            </ul>
            <ul class="sidebar--bottom-items">
                <li>
                    <a href="NurseSettings.html">
                        <span class="icon">
                            <i class="ri-settings-3-line"></i>
                        </span>
                        <span class="sidebar--item">Settings</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="mainContent">
            <div class="title">
                <h2 class="maintitle"><i class="ri-time-line"></i> Weekly Duty Schedule </h2>
                <p>View your scheduled shifts and assigned office locations.</p>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Day of Week</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Assigned Office</th>
                        <th>Collaborating Doctor</th>
                    </tr>
                </thead>
                <tbody id="scheduleTableBody">
                    <tr><td colspan="5" style="text-align: center;">Loading schedule...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
    <script>
        async function fetchSchedule() {
            try {
                const res = await fetch('/api/nurse/schedule');
                const tbody = document.getElementById('scheduleTableBody');
                if (res.ok) {
                    const schedules = await res.json();
                    tbody.innerHTML = '';
                    if (schedules.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No scheduled shifts found.</td></tr>';
                        return;
                    }
                    schedules.forEach(s => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${s.Day_of_Week}</td>
                                <td>${s.Start_Time}</td>
                                <td>${s.End_Time}</td>
                                <td>${s.Office_Name}</td>
                                <td>${s.Doctor_Name}</td>
                            </tr>
                        `;
                    });
                }
            } catch (e) {
                console.error("Error fetching schedule", e);
            }
        }
        fetchSchedule();
    </script>
</body>
</html>
