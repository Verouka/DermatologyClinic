
<!DOCTYPE html>
<html>
<head>

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <section class="header"> 
        <div class="a">
           <img src="icons8-heart-with-pulse-40.png" alt="Clinic logo" width="35">
           <h1 class="h1"> Dermatology Clinic </h1>
        </div> 
        <div class="notification--profile">
            
            <div class="picon bell">
                <i class="ri-notification-2-line"></i>
            </div>
            <div class="picon profile">
                <img class="img" src="account.png" alt="">
                
            </div>
            <button class="logout" type="button" >
                     Log Out
            </button>

            

        </div>
        
    
    
    </section>
    <section class="main">
        <div class="sidebar"> 
            <ul class="sidebar--items">
                <li>
                    <a href="patientDashboard.html" >
                        <span class="icon icon-1"><i class="ri-layout-grid-line"></i></span>
                        <span  class="sidebar--item">Dashboard</span>
                    </a>
                </li>
                <li>
                     <a href="PatientProfile.html" class="active--link">
                        <span class="icon icon-2"><i class="ri-user-line"></i></span>
                        <span class="sidebar--item">My Profile</span>
                     </a>
                </li>
                <li>
                     <a href="patientAppointment.html">
                        <span class="icon icon-3"><i class="ri-calendar-2-line"></i></span>
                        <span class="sidebar--item">My Appointments</span>
                     </a>
                </li>
                <li>
                     <a href="MedicalRecords.html">
                        <span class="icon icon-4"><i class="ri-file-list-3-line"></i></span>
                        <span class="sidebar--item">Medical Records</span>
                     </a>
                </li>
                <li>
                     <a href="BillsPayment.html">
                        <span class="icon icon-5"><i class="ri-bank-card-line"></i></span>
                        <span class="sidebar--item">Bills And Payments</span>
                     </a>
                </li>


            </ul>


            <ul class="sidebar--bottom-items">
                <li>
                     <a href="">
                        <span class="icon icon-6"><i class="ri-settings-3-line"></i></span>
                        <span class="sidebar--item">Settings</span>
                     </a>
                </li>
              
            </ul>

                



    
        
        
        </div>

        <div class="mainContent">
        <div class="overview">

        <div class="title">
            <h2 class="maintitle">My Profile</h2>
            <p>View and manage your personal information.</p>
        </div>

        <div class="profileCard">
            <div class="profileHeader">
                <i class="ri-user-line"></i>
                <h3>Patient Information</h3>
            </div>

            <div class="profileData">

                <div class="profileField">
                    <label for="FirstName">First Name</label>
                    <input type="text" id="FirstName" name="FirstName" maxlength="45" readonly>
                </div>

                <div class="profileField">
                    <label for="LastName">Last Name</label>
                    <input type="text" id="LastName" name="LastName" maxlength="45" readonly>
                </div>

                <div class="profileField">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth" readonly>
                </div>

                <div class="profileField">
                    <label for="patientID">Patient ID</label>
                    <input type="text" id="patientID" name="patientID" readonly>
                </div>

                <div class="profileField">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" readonly>
                </div>

                <div class="profileField">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" readonly>
                </div>

                <div class="profileField">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" maxlength="45" readonly>
                </div>

            </div>

        </div>

        </div>
        <div class="profileActions">
            <button type="button" class="editBtn">Edit Profile</button>
        </div>
        </div>








    </section>

<script src="./patientProfile.js"></script>
<script src="../logout.js"></script>
</body>
</html>
