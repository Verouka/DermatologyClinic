
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="./securityrole.js" data-role="patient"></script>

    <title>My Medical Records</title>

    <link rel="stylesheet" href="MedicalRecords.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <section class="header">
        <div class="a">
            <img src="icons8-heart-with-pulse-40.png"
                 alt="Clinic logo" width="35">
            <h1 class="h1">Dermatology Clinic</h1>
        </div>

        <div class="notification--profile">
            <div class="picon bell">
                <i class="ri-notification-2-line"></i>
            </div>

            <div class="picon profile">
                <img class="img" src="account.png" alt="">
            </div>

            <button class="logout" type="button">
                Log Out
            </button>
        </div>
    </section>

    <section class="main">
        <div class="sidebar">
            <ul class="sidebar--items">
                <li>
                    <a href="patientDashboard.html">
                        <span class="icon icon-1">
                            <i class="ri-layout-grid-line"></i>
                        </span>
                        <span class="sidebar--item">Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="PatientProfile.html">
                        <span class="icon icon-2">
                            <i class="ri-user-line"></i>
                        </span>
                        <span class="sidebar--item">My Profile</span>
                    </a>
                </li>

                <li>
                    <a href="patientAppointment.html">
                        <span class="icon icon-3">
                            <i class="ri-calendar-2-line"></i>
                        </span>
                        <span class="sidebar--item">My Appointments</span>
                    </a>
                </li>

                <li>
                    <a href="MedicalRecords.html" class="active--link">
                        <span class="icon icon-4">
                            <i class="ri-file-list-3-line"></i>
                        </span>
                        <span class="sidebar--item">Medical Records</span>
                    </a>
                </li>

                <li>
                    <a href="BillsPayment.html">
                        <span class="icon icon-5">
                            <i class="ri-bank-card-line"></i>
                        </span>
                        <span class="sidebar--item">Bills And Payments</span>
                    </a>
                </li>
            </ul>

            <ul class="sidebar--bottom-items">
                <li>
                    <a href="#">
                        <span class="icon icon-6">
                            <i class="ri-settings-3-line"></i>
                        </span>
                        <span class="sidebar--item">Settings</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="mainContent">
            <div class="overview">

                <div class="title">
                    <h2 class="maintitle">Medical Records</h2>
                    <p>View your medical history and treatment information.</p>
                </div>

                <div class="medicalRecords">

                    <div class="recordTabs">
                        <button type="button"
                                class="tabBtn activeTab"
                                data-tab="medicalHistory">
                            Medical History
                        </button>

                        <button type="button"
                                class="tabBtn"
                                data-tab="allergies">
                            Allergies
                        </button>

                        <button type="button"
                                class="tabBtn"
                                data-tab="diagnoses">
                            Diagnoses
                        </button>

                        <button type="button"
                                class="tabBtn"
                                data-tab="treatments">
                            Treatments
                        </button>

                        <button type="button"
                                class="tabBtn"
                                data-tab="prescriptions">
                            Prescriptions
                        </button>

                        <button type="button"
                                class="tabBtn"
                                data-tab="referrals">
                            Referrals
                        </button>
                    </div>

                    <div class="recordCard">
                        <div class="recordHeader">
                            <i class="ri-file-list-3-line"></i>
                            <h3 id="recordTitle">Medical History</h3>
                        </div>

                        <div id="recordContent" aria-live="polite">
                            <p>Loading medical records...</p>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </section>

    <script src="./medicalRecords.js"></script>
    <script src="./logout.js"></script>
</body>
</html>
