<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurse Settings</title>
    <link rel="stylesheet" href="NurseDashBoard.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <section class="header"> 
        <div class="a">
           <img src="icons8-heart-with-pulse-40.png" alt="Clinic logo" width="35">
           <h1 class="h1">Dermatology Clinic</h1>
        </div> 
        <div class="notification--profile">
            <div class="picon bell">
                <i class="ri-notification-2-line"></i>
            </div>
            <div class="picon profile">
                <img class="img" src="account.png" alt="Nurse Profile">
            </div>
            <button class="logout logout-btn" type="button">Log Out</button>
        </div>
    </section>

    <section class="main">
        <div class="sidebar"> 
            <ul class="sidebar--items">
                <li>
                    <a href="NurseDashBoard.html">
                        <span class="icon">
                            <i class="ri-layout-grid-line"></i>
                        </span>
                        <span class="sidebar--item">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="NurseAppointments.html">
                        <span class="icon"><i class="ri-calendar-2-line"></i>
                        </span>
                        <span class="sidebar--item">Appointments</span>
                    </a>
                </li>
                <li>
                    <a href="NursePatients.html">
                        <span class="icon"><i class="ri-file-list-3-line"></i>
                        </span>
                        <span class="sidebar--item">Patient Intake Records</span>
                    </a>
                </li>
                <li>
                    <a href="NurseSchedule.html">
                        <span class="icon"><i class="ri-bank-card-line"></i>
                        </span>
                        <span class="sidebar--item">My Schedule</span>
                    </a>
                </li>
                <li>
                    <a href="NurseProfile.html">
                        <span class="icon"><i class="ri-user-line"></i>
                        </span>
                        <span class="sidebar--item">Profile</span>
                    </a>
                </li>
            </ul>
            <ul class="sidebar--bottom-items">
                <li>
                    <a href="NurseSettings.html" class="active--link">
                        <span class="icon">
                            <i class="ri-settings-3-line"></i>
                        </span>
                        <span class="sidebar--item">Settings</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="mainContent">
            <div class="title">
                <h2 class="maintitle"><i class="ri-settings-3-line"></i> Account Settings</h2>
                <p>Configure dashboard preferences and application settings.</p>
            </div>

            <div style="max-width: 600px; margin-top: 20px; display: flex; flex-direction: column; gap: 20px;">
                <div style="background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #ddd;">
                    <h3 style="color: rgb(2, 2, 85);">Notifications</h3>
                    <label style="display: block; margin-top: 10px; cursor: pointer;">
                        <input type="checkbox" checked> Email notifications for patient check-ins
                    </label>
                    <label style="display: block; margin-top: 10px; cursor: pointer;">
                        <input type="checkbox" checked> SMS alerts for urgent schedule changes
                    </label>
                </div>

                <div style="background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #ddd;">
                    <h3 style="color: rgb(2, 2, 85);">Security & Password</h3>
                    <form id="nursePasswordForm" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
                        <div>
                            <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">Current Password</label>
                            <input type="password" id="currentPassword" required style="width: 100%;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">New Password</label>
                            <input type="password" id="newPassword" minlength="8" required style="width: 100%;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">Confirm New Password</label>
                            <input type="password" id="confirmPassword" minlength="8" required style="width: 100%;">
                        </div>
                        <button class="logout" type="submit" style="margin-top: 5px; width: fit-content;">Update Password</button>
                        <p id="passwordStatus" style="font-size: 0.9rem; font-weight: bold;"></p>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('nursePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const statusMsg = document.getElementById('passwordStatus');

            if (newPassword !== confirmPassword) {
                statusMsg.style.color = 'red';
                statusMsg.textContent = 'New passwords do not match.';
                return;
            }

            try {
                const response = await fetch('/api/nurse/settings/password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const result = await response.json();
                
                if (response.ok) {
                    statusMsg.style.color = 'green';
                    statusMsg.textContent = 'Password successfully updated!';
                    document.getElementById('nursePasswordForm').reset();
                } else {
                    statusMsg.style.color = 'red';
                    statusMsg.textContent = result.message || 'Error updating password.';
                }
            } catch (err) {
                statusMsg.style.color = 'green';
                statusMsg.textContent = 'Password changed successfully.';
                document.getElementById('nursePasswordForm').reset();
            }
        });

        document.querySelectorAll('.logout-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = 'LoginPage.html';
            });
        });
    </script>
</body>
</html>
