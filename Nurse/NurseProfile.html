<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../securityrole.js" data-role="nurse"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nurse Profile</title>

    <link rel="stylesheet" href="NurseDashBoard.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <section class="header">
        <div class="a">
            <img src="../icons8-heart-with-pulse-40.png"
                 alt="Clinic logo" width="35">
            <h1 class="h1">Dermatology Clinic</h1>
        </div>

        <div class="notification--profile">
            <div class="picon bell">
                <i class="ri-notification-2-line"></i>
            </div>

            <div class="picon profile">
                <img class="img" src="../account.png"
                     alt="Nurse Profile">
            </div>

            <button class="logout" type="button">
                Log Out
            </button>
        </div>
    </section>

    <section class="main">
        <div class="sidebar">
            <ul class="sidebar--items">

                <li>
                    <a href="NurseDashBoard.html">
                        <span class="icon">
                            <i class="ri-layout-grid-line"></i>
                        </span>
                        <span class="sidebar--item">Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="NurseAppointments.html">
                        <span class="icon">
                            <i class="ri-calendar-2-line"></i>
                        </span>
                        <span class="sidebar--item">Appointments</span>
                    </a>
                </li>

                <li>
                    <a href="NursePatients.html">
                        <span class="icon">
                            <i class="ri-file-list-3-line"></i>
                        </span>
                        <span class="sidebar--item">
                            Patient Intake Records
                        </span>
                    </a>
                </li>

                <li>
                    <a href="NurseSchedule.html">
                        <span class="icon">
                            <i class="ri-bank-card-line"></i>
                        </span>
                        <span class="sidebar--item">My Schedule</span>
                    </a>
                </li>

                <li>
                    <a href="NurseProfile.html" class="active--link">
                        <span class="icon">
                            <i class="ri-user-line"></i>
                        </span>
                        <span class="sidebar--item">Profile</span>
                    </a>
                </li>
            </ul>

            <ul class="sidebar--bottom-items">
                <li>
                    <a href="NurseSettings.html">
                        <span class="icon">
                            <i class="ri-settings-3-line"></i>
                        </span>
                        <span class="sidebar--item">Settings</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="mainContent">
            <div class="title">
                <h2 class="maintitle">
                    <i class="ri-user-settings-line"></i>
                    Nurse Profile
                </h2>

                <p>
                    Manage your personal details,
                    contact information, and license status
                </p>
            </div>

            <form
                id="nurseProfileForm"
                style="
                    max-width: 800px;
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 20px;
                "
            >

                <div>
                    <label for="Nurse_ID">
                        <strong>Nurse ID:</strong>
                    </label><br>

                    <input
                        type="text"
                        id="Nurse_ID"
                        name="Nurse_ID"
                        readonly
                        style="width: 100%; background-color: #f0f0f0;"
                    >
                </div>

                <div>
                    <label for="License_Number">
                        <strong>License Number:</strong>
                    </label><br>

                    <input
                        type="text"
                        id="License_Number"
                        name="License_Number"
                        readonly
                        style="width: 100%; background-color: #f0f0f0;"
                    >
                </div>

                <div>
                    <label for="First_Name">
                        <strong>First Name:</strong>
                    </label><br>

                    <input
                        type="text"
                        id="First_Name"
                        name="First_Name"
                        maxlength="45"
                        required
                        style="width: 100%;"
                    >
                </div>

                <div>
                    <label for="Last_Name">
                        <strong>Last Name:</strong>
                    </label><br>

                    <input
                        type="text"
                        id="Last_Name"
                        name="Last_Name"
                        maxlength="45"
                        required
                        style="width: 100%;"
                    >
                </div>

                <div>
                    <label for="Email">
                        <strong>Email:</strong>
                    </label><br>

                    <input
                        type="email"
                        id="Email"
                        name="Email"
                        maxlength="100"
                        required
                        style="width: 100%;"
                    >
                </div>

                <div>
                    <label for="Phone">
                        <strong>Phone:</strong>
                    </label><br>

                    <input
                        type="tel"
                        id="Phone"
                        name="Phone"
                        maxlength="20"
                        style="width: 100%;"
                    >
                </div>

                <div>
                    <label for="Street">
                        <strong>Street Address:</strong>
                    </label><br>

                    <input
                        type="text"
                        id="Street"
                        name="Street"
                        maxlength="100"
                        style="width: 100%;"
                    >
                </div>

                <div>
                    <label for="City">
                        <strong>City:</strong>
                    </label><br>

                    <input
                        type="text"
                        id="City"
                        name="City"
                        maxlength="45"
                        style="width: 100%;"
                    >
                </div>

                <div>
                    <label for="State">
                        <strong>State:</strong>
                    </label><br>

                    <input
                        type="text"
                        id="State"
                        name="State"
                        maxlength="45"
                        style="width: 100%;"
                    >
                </div>

                <div>
                    <label for="Zip_Code">
                        <strong>Zip Code:</strong>
                    </label><br>

                    <input
                        type="text"
                        id="Zip_Code"
                        name="Zip_Code"
                        maxlength="5"
                        pattern="[0-9]{5}"
                        required
                        style="width: 100%;"
                    >
                </div>

                <div>
                    <label for="OFFICE_Office_ID">
                        <strong>Assigned Office ID:</strong>
                    </label><br>

                    <input
                        type="text"
                        id="OFFICE_Office_ID"
                        name="OFFICE_Office_ID"
                        readonly
                        style="width: 100%; background-color: #f0f0f0;"
                    >
                </div>

                <div>
                    <label for="Start_Date">
                        <strong>Start Date:</strong>
                    </label><br>

                    <input
                        type="date"
                        id="Start_Date"
                        name="Start_Date"
                        readonly
                        style="width: 100%; background-color: #f0f0f0;"
                    >
                </div>

                <div style="grid-column: span 2; margin-top: 10px;">
                    <button
                        class="logout"
                        type="submit"
                    >
                        Save Changes
                    </button>

                    <p
                        id="nurseProfileStatus"
                        role="status"
                        aria-live="polite"
                        style="margin-top: 12px;"
                    ></p>
                </div>

            </form>
        </div>
    </section>

    <script src="./NurseProfile.js"></script>
    <script src="../logout.js"></script>
</body>
</html>
